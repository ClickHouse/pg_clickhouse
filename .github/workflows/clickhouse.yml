name: 🏠 ClickHouse CI
on:
  workflow_call:
    inputs:
      ch: { type: string, required: true, description: JSON list of releases }
permissions:
  contents: read

jobs:
  build:
    env: { pg: 19, COVERAGE: 1, GCOV_PREFIX: /tmp/gcov }
    strategy:
      fail-fast: false
      matrix:
        ch: ${{ fromJSON(inputs.ch) }}
    name: 🏠 ClickHouse ${{ matrix.ch }}
    runs-on: ubuntu-latest
    container: pgxn/pgxn-tools
    steps:
      - name: Start Postgres
        run: pg-start ${{ env.pg }} libcurl4-openssl-dev uuid-dev liblz4-dev libzstd-dev libre2-dev libicu-dev lcov
      - name: Install Extensions
        run: pgxn install re2
      - name: Checkout the Repository
        uses: actions/checkout@v7
        with: { submodules: recursive }
      - name: Start ClickHouse
        env: { CH_RELEASE: "${{ matrix.ch }}" }
        run: .github/ubuntu/clickhouse.sh
      - name: Prepare Coverage
        run: ci/coverage.sh prepare
      - name: Test
        id: test
        run: pg-build-test
      - name: Upload Diffs
        if: failure() && steps.test.outcome == 'failure'
        uses: actions/upload-artifact@v7
        with:
          name: regression-ch${{ matrix.ch }}
          path: |
            regression.diffs
            results
      - name: Stop Postgres
        if: ${{ !cancelled() }}
        run: ci/coverage.sh stop
      - name: Collect Coverage
        if: ${{ !cancelled() }}
        env:
          LANE: ch${{ matrix.ch }}
          RUNS: default=${{ steps.test.outcome }}
        run: make coverage-lcov
      - name: Upload Coverage
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v7
        with:
          name: coverage-ch${{ matrix.ch }}
          path: coverage
          if-no-files-found: error
          overwrite: true
