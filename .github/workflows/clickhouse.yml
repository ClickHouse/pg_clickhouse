name: 🏠 ClickHouse CI
on:
  workflow_call:
    inputs:
      ch: { type: string, required: true, description: JSON list of releases }
permissions:
  contents: read

jobs:
  build:
    env: { pg: 19, COVERAGE: 1, GCOV_PREFIX: /tmp/gcov }
    strategy:
      fail-fast: false
      matrix:
        ch: ${{ fromJSON(inputs.ch) }}
    name: 🏠 ClickHouse ${{ matrix.ch }}
    runs-on: ubuntu-latest
    steps:
      - name: Start Postgres
        uses: pgxn/postgres-action@v0
        with:
          version: "${{ env.pg }}"
          packages: libcurl4-openssl-dev uuid-dev liblz4-dev libzstd-dev libre2-dev libicu-dev lcov
      - name: Install Extensions
        run: sudo pgxn install re2 && sudo pgxn install vector
      - name: Checkout the Repository
        uses: actions/checkout@v7
        with: { submodules: recursive }
      - name: Start ClickHouse
        env: { CH_RELEASE: "${{ matrix.ch }}" }
        run: sudo .github/ubuntu/clickhouse.sh
      - name: Prepare Coverage
        run: sudo -E ci/coverage.sh prepare
      - name: Build
        run: make
      - name: Install
        run: sudo make install
      - name: Test
        id: test
        run: make installcheck
      - name: Show Diffs
        if: failure() && steps.test.outcome == 'failure'
        run: find . -name regression.diffs -exec cat {} +
      - name: Upload Diffs
        if: failure() && steps.test.outcome == 'failure'
        uses: actions/upload-artifact@v7
        with:
          name: regression-ch${{ matrix.ch }}
          path: |
            regression.diffs
            results
      - name: Stop Postgres
        if: ${{ !cancelled() }}
        run: sudo -E ci/coverage.sh stop
      - name: Collect Coverage
        if: ${{ !cancelled() }}
        env:
          LANE: ch${{ matrix.ch }}
          RUNS: default=${{ steps.test.outcome }}
        run: make coverage-lcov
      - name: Upload Coverage
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v7
        with:
          name: coverage-ch${{ matrix.ch }}
          path: coverage
          if-no-files-found: error
          overwrite: true
