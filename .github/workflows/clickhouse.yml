name: 🏠 ClickHouse CI
on:
  push:
    branches: [main, wip/**]
  pull_request:
  schedule:
    - cron: "0 13 10 * *" # Monthly at 13:00 on the tenth
permissions:
  contents: read

jobs:
  build:
    env: { pg: 19 }
    strategy:
      fail-fast: false
      matrix:
        # Test latest version and all LTS releases.
        # .github/ubuntu/ch-versions --lts --latest-stable --earliest 23 | pbcopy
        ch:
          - 26.9.20.23-stable
          - 26.8.29.10-lts
          - 26.3.53.4-lts
          - 25.8.33.6-lts
          - 25.3.14.14-lts
          - 24.8.14.39-lts
          - 24.3.18.7-lts
          - 23.8.16.40-lts
          - 23.3.22.3-lts
    name: 🏠 ClickHouse ${{ matrix.ch }}
    runs-on: ubuntu-latest
    steps:
      - name: Start Postgres
        uses: pgxn/postgres-action@v0
        with:
          version: "${{ env.pg }}"
          packages: libcurl4-openssl-dev uuid-dev liblz4-dev libzstd-dev libre2-dev libicu-dev
      - name: Install Extensions
        run: sudo pgxn install re2 && sudo pgxn install vector
      - name: Checkout the Repository
        uses: actions/checkout@v7
        with: { submodules: recursive }
      - name: Start ClickHouse
        env: { CH_RELEASE: "${{ matrix.ch }}" }
        run: sudo --preserve-env=CH_RELEASE .github/ubuntu/clickhouse.sh
      - name: Build
        run: make
      - name: Install
        run: sudo make install
      - name: Test
        id: test
        run: make installcheck
      - name: Show Diffs
        if: failure() && steps.test.outcome == 'failure'
        run: find . -name regression.diffs -exec cat {} +
      - name: Upload Diffs
        if: failure() && steps.test.outcome == 'failure'
        uses: actions/upload-artifact@v7
        with:
          name: regression-ch${{ matrix.ch }}
          path: |
            regression.diffs
            results
