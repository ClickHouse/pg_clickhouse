name: 🔎 Lint
on:
  push:
    branches: [main, wip/**]
  pull_request:
permissions:
  contents: read

jobs:
  lint:
    name: 🔎 Lint Code
    runs-on: ubuntu-latest
    env: { pg: 19 }
    steps:
      - name: Start Postgres
        uses: pgxn/postgres-action@v0
        with:
          version: "${{ env.pg }}"
          start: false
          packages: libcurl4-openssl-dev uuid-dev liblz4-dev libzstd-dev clang-tidy bear shellcheck
      - name: Checkout the Repository
        uses: actions/checkout@v7
        with: { submodules: recursive }
      - name: Install pre-commit
        run: make debian-install-lint
      - name: Generate compile_commands.json
        run: make compile_commands.json
      - name: Lint the Code
        run: make lint
