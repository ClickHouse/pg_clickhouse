name: 🐘 Postgres CI
on:
  workflow_call:
    inputs:
      pg: { type: string, required: true, description: JSON list of platforms }
permissions:
  contents: read

jobs:
  build:
    name: ${{ matrix.pg.emoji }} ${{ matrix.pg.arch }} 🐘 ${{ matrix.pg.version }}
    runs-on: ${{ matrix.pg.runner }}
    strategy:
      fail-fast: false
      matrix:
        pg: ${{ fromJSON(inputs.pg) }}
    env: { COVERAGE: 1, GCOV_PREFIX: /tmp/gcov }
    steps:
      - name: Start Postgres ${{ matrix.pg.version }}
        uses: pgxn/postgres-action@v0
        with:
          version: ${{ matrix.pg.version }}
          packages: libcurl4-openssl-dev uuid-dev liblz4-dev libzstd-dev libre2-dev libicu-dev lcov
      - name: Install Extensions
        run: sudo pgxn install re2 && sudo pgxn install vector
      - name: Checkout the Repository
        uses: actions/checkout@v7
        with: { submodules: recursive }
      - name: Start ClickHouse
        run: sudo .github/ubuntu/clickhouse.sh
      - name: Prepare Coverage
        run: sudo -E ci/coverage.sh prepare
      - name: Build
        run: make
      - name: Install
        run: sudo make install
      - name: Test
        id: test
        run: make installcheck
      - name: Show Diffs
        if: failure() && steps.test.outcome == 'failure'
        run: find . -name regression.diffs -exec cat {} +
      - name: Upload Diffs
        if: failure() && steps.test.outcome == 'failure'
        uses: actions/upload-artifact@v7
        with:
          name: regression-pg${{ matrix.pg.version }}-${{ matrix.pg.arch }}
          path: |
            regression.diffs
            results
      - name: Test SQL_ASCII
        id: ascii
        env:
          REGRESS_OPTS: --no-locale --encoding=SQL_ASCII
          TESTS: test/sql/encoding.sql
        run: make installcheck
      - name: Stop Postgres
        if: ${{ !cancelled() }}
        run: sudo -E ci/coverage.sh stop
      - name: Collect Coverage
        if: ${{ !cancelled() }}
        env:
          LANE: pg${{ matrix.pg.version }}-${{ matrix.pg.arch }}
          RUNS: default=${{ steps.test.outcome }} SQL_ASCII=${{ steps.ascii.outcome }}
        run: make coverage-lcov
      - name: Upload Coverage
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v7
        with:
          name: coverage-pg${{ matrix.pg.version }}-${{ matrix.pg.arch }}
          path: coverage
          if-no-files-found: error
          overwrite: true
