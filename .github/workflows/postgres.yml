name: 🐘 Postgres CI
on:
  push:
    branches: [main, wip/**]
  pull_request:
  schedule:
    - cron: "0 12 10 * *" # Monthly at noon on the tenth
permissions:
  contents: read

jobs:
  matrix:
    name: 📋 Generate Matrix
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.matrix.outputs.matrix }}
    steps:
      - name: Generate Matrix
        id: matrix
        uses: pgxn/matrix-action@v0
        with:
          min-version: 14
          beta: true
          deprecated: true
          no-os: windows macos

  build:
    name: ${{ matrix.pg.emoji }} ${{ matrix.pg.arch }} 🐘 ${{ matrix.pg.version }}
    needs: matrix
    runs-on: ${{ matrix.pg.runner }}
    strategy:
      fail-fast: false
      matrix:
        pg: ${{ fromJson(needs.matrix.outputs.matrix) }}
    # name: 🐘 PostgreSQL ${{ matrix.pg }} ${{ matrix.os.icon }} ${{ matrix.os.arch }}
    steps:
      - name: Start Postgres ${{ matrix.pg.version }}
        uses: pgxn/postgres-action@v0
        with:
          version: ${{ matrix.pg.version }}
          packages: libcurl4-openssl-dev uuid-dev liblz4-dev libzstd-dev libre2-dev libicu-dev
      - name: Install Extensions
        run: sudo pgxn install re2 && sudo pgxn install vector
      - name: Checkout the Repository
        uses: actions/checkout@v7
        with: { submodules: recursive }
      - name: Start ClickHouse
        run: sudo .github/ubuntu/clickhouse.sh
      - name: Build
        run: make
      - name: Install
        run: sudo make install
      - name: Test
        id: test
        run: make installcheck
      - name: Show Diffs
        if: failure() && steps.test.outcome == 'failure'
        run: find . -name regression.diffs -exec cat {} +
      - name: Upload Diffs
        if: failure() && steps.test.outcome == 'failure'
        uses: actions/upload-artifact@v7
        with:
          name: regression-ch${{ matrix.ch }}
          path: |
            regression.diffs
            results
      - name: Test SQL_ASCII
        env:
          REGRESS_OPTS: --no-locale --encoding=SQL_ASCII
          TESTS: test/sql/encoding.sql
        run: make installcheck
