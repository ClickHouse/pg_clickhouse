name: 🚀 Bundle & Release
on:
  push:
    branches: [main, wip/**]
    tags: ["v[0-9]+.[0-9]+.[0-9]+"]
  pull_request:
permissions:
  contents: write
jobs:
  release:
    name: Release on GitHub and PGXN
    runs-on: ubuntu-latest
    env: { pg: 19 }
    steps:
      - name: Check out the repo
        uses: actions/checkout@v7
      - name: Start Postgres
        uses: pgxn/postgres-action@v0
        with:
          version: "${{ env.pg }}"
          packages: libcurl4-openssl-dev uuid-dev liblz4-dev libzstd-dev libre2-dev libicu-dev
      - name: Start ClickHouse
        env: { CH_RELEASE: "${{ matrix.ch }}" }
        run: sudo --preserve-env=CH_RELEASE .github/ubuntu/clickhouse.sh
      - name: Build Release Archive
        uses: pgxn/release-action@v0
        with:
          submodules: true
          dry-run: true
      - name: Test the Release
        env: { DIST_TEST_SUDO: sudo }
        run: make dist-test
      - name: Release on PGXN
        uses: pgxn/release-action@v0
        id: pgxn
        with:
          submodules: true
          username: ${{ secrets.PGXN_USERNAME }}
          password: ${{ secrets.PGXN_PASSWORD }}
          dry-run: ${{ !startsWith( github.ref, 'refs/tags/v' ) }}
      - name: Generate Release Notes
        id: notes
        uses: theory/changelog-version-notes-action@v0
        if: startsWith( github.ref, 'refs/tags/v' )
      - name: Create GitHub Release
        if: startsWith( github.ref, 'refs/tags/v' )
        uses: softprops/action-gh-release@v3
        with:
          name: "Release ${{ github.ref_name }}"
          body_path: "${{ steps.notes.outputs.file }}"
          files: ${{ steps.bundle.outputs.bundle }}
